[workspace]
resolver = "2"
members = [
    "crates/launcher-core",
    "crates/windows-backend",
    "crates/android-backend",
    "crates/launcher-service",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.82"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
